<title>Quizlane</title>

<style>
:root{--bg:#f3f4ff;--card:#fff;--ink:#14152b;--mute:#5b5d7a;--line:#d6d9f3;--pri:#3a3df0;--hi:#ffe14d;--ok:#0f8a62;--bad:#d93a55;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f23;--card:#1a1c3a;--ink:#f1f2ff;--mute:#a4a7d0;--line:#2e3160;--pri:#8a8dff;--ok:#3ed7a1;--bad:#ff7088;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f23;--card:#1a1c3a;--ink:#f1f2ff;--mute:#a4a7d0;--line:#2e3160;--pri:#8a8dff;--ok:#3ed7a1;--bad:#ff7088;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-weight:800;font-size:34px;letter-spacing:-1.5px;margin:0}
h2{font-size:22px;margin:0 0 8px;font-weight:800;letter-spacing:-.5px}
h3{font-size:16px;margin:0 0 4px}
.chip{background:var(--hi);color:#14152b;font-weight:800;padding:4px 12px;border-radius:99px;font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
nav button{flex:1;min-width:64px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
button.on,button.pri{background:var(--pri);color:var(--on,#fff)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--mute);font-size:14px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.tile{display:flex;gap:10px;align-items:center;text-align:left;border:0;color:#fff;padding:16px;font-size:17px;border-radius:12px;box-shadow:0 5px 0 rgba(0,0,0,.28);min-height:64px}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.t0{background:#3a3df0}.t1{background:#d93a55}.t2{background:#0f8a62}.t3{background:#ffe14d;color:#14152b}
.tile.ok{outline:4px solid var(--ok);outline-offset:2px}.tile.no{opacity:.45}.tile.hid{visibility:hidden}
.sym{font-size:22px;width:28px;text-align:center}
.q{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:14px 0}
.lb{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lb b:first-child{width:28px}.lb span{flex:1}
.me{background:var(--hi);color:#14152b;border-radius:8px;padding:8px;border:0}
.msg{padding:8px 12px;border-radius:10px;margin:6px 0;max-width:90%}
.u{background:var(--pri);color:var(--bg);margin-left:auto}.a{background:var(--line)}
.ok-t{color:var(--ok);font-weight:800}.bad-t{color:var(--bad);font-weight:800}
label{display:block;font-weight:600;margin:8px 0 4px;font-size:14px}
</style>

<body><div class="wrap">

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SYM=['▲','◆','●','■'];
const TF=['True','False'];
const QZ=[
{id:1,title:'Solar System Basics',subj:'Science',qs:[
{q:'Which planet is closest to the Sun?',o:['Mercury','Venus','Earth','Mars'],a:0,e:'Mercury orbits about 58 million km from the Sun.'},
{q:'Venus spins in the opposite direction to most planets.',o:TF,a:0,e:'Venus has retrograde rotation, so the Sun rises in the west.'},
{q:'Which gas makes up most of Earth’s atmosphere?',o:['Oxygen','Nitrogen','Carbon dioxide','Argon'],a:1,e:'Nitrogen is about 78% of the air; oxygen is about 21%.'},
{q:'Which is the largest planet?',o:['Saturn','Jupiter','Neptune','Earth'],a:1,e:'Jupiter holds more than twice the mass of all other planets combined.'},
{q:'How long does sunlight take to reach Earth?',o:['8 seconds','8 minutes','8 hours','8 days'],a:1,e:'About 150 million km at light speed is roughly 8 minutes.'}]},
{id:2,title:'World Capitals',subj:'Geography',qs:[
{q:'What is the capital of Australia?',o:['Sydney','Melbourne','Canberra','Perth'],a:2,e:'Canberra was built as a compromise between Sydney and Melbourne.'},
{q:'What is the capital of Canada?',o:['Toronto','Ottawa','Montreal','Vancouver'],a:1,e:'Ottawa sits on the Ontario–Quebec border.'},
{q:'Istanbul is the capital of Turkey.',o:TF,a:1,e:'The capital is Ankara.'},
{q:'What is the capital of Brazil?',o:['Rio de Janeiro','Brasília','São Paulo','Salvador'],a:1,e:'Brasília replaced Rio as capital in 1960.'},
{q:'What is the capital of Kenya?',o:['Nairobi','Mombasa','Kampala','Dodoma'],a:0,e:'Nairobi is Kenya’s capital and largest city.'}]},
{id:3,title:'Mental Math',subj:'Maths',qs:[
{q:'7 × 8 = ?',o:['54','56','58','64'],a:1,e:'7 × 8 = 56.'},
{q:'What is 15% of 200?',o:['20','25','30','35'],a:2,e:'10% is 20 and 5% is 10, so 30.'},
{q:'0.5 is the same as 1/2.',o:TF,a:0,e:'Half is 0.5 in decimal form.'},
{q:'What is the square root of 144?',o:['10','11','12','14'],a:2,e:'12 × 12 = 144.'},
{q:'9² − 4² = ?',o:['55','65','45','75'],a:1,e:'81 − 16 = 65.'}]}];
let S={auth:'loading',cards:[],target:50,rtime:'18:00',remind:false,rlast:'',mast:{},lessons:{},yr:5,theme:'auto',accent:'indigo',ls:'',lt:'',pr:{subj:'Maths',grade:5,lvl:2,n:10},user:'you_01',xp:0,ledger:[],plays:{},bests:{},stats:{},wl:{w:0,l:0},key:'',model:'gemini-2.5-flash',keyOk:null,reqs:0,pub:true,quizzes:QZ,tab:'learn',game:null,chat:[],draft:{title:'',subj:'',qs:[]},note:'',inv:'',lbf:'all',nid:10};
try{const o=JSON.parse(localStorage.getItem('ql')||'null');if(o)Object.assign(S,o)}catch(e){}
const save=()=>{try{const{game,tab,chat,note,inv,auth,...r}=S;localStorage.setItem('ql',JSON.stringify(r))}catch(e){}sync()};
let T,OT,PQ;
const lvl=()=>Math.floor(Math.sqrt(S.xp/50))+1;
const mxp=()=>{const d=new Date(),s=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1);return S.ledger.filter(l=>l.ts>=s).reduce((a,l)=>a+l.amt,0)};
const add=(src,amt)=>{if(amt<=0)return;S.ledger.push({src,amt,ts:Date.now()});S.xp+=amt};
const go=t=>{S.tab=t;S.note='';render()};

function render(){
 $('#nav').innerHTML=[['learn','Learn'],['play','Practice'],['duel','Friends'],['notes','Alerts'+(NN()?' ('+NN()+')':'')],['cards','Cards'+(dueCards().length?' ('+dueCards().length+')':'')],['create','Create'],['ranks','Ranks'],['tutor','Tutor'],['set','Settings']].map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#me').textContent=`@${S.user} • Level ${lvl()} • ${S.xp} XP`;
 const gate=S.auth!='ready'&&S.auth!='offline';$('#nav').style.display=gate?'none':'';$('#main').innerHTML=gate?vGate():S.game?vGame():({learn:vLearn,cards:vCards,notes:vNotes,set:vSet,play:vPlay,duel:vDuel,create:vCreate,ranks:vRanks,tutor:vTutor}[S.tab])();
 save();
}
const BANK=[
['Science',1,1,'What do plants need to grow?','Sunlight and water',['Only candy','Only darkness','Plastic'],'Plants use sunlight, water and air to make food.'],
['Science',1,2,'Which animal is a mammal?','Dolphin',['Shark','Trout','Eagle'],'Dolphins breathe air and feed milk to their young.'],
['Science',2,1,'What state of matter is ice?','Solid',['Liquid','Gas','Plasma'],'Ice is frozen water, a solid.'],
['Science',2,2,'Which planet is known as the Red Planet?','Mars',['Venus','Jupiter','Mercury'],'Iron oxide gives Mars its red colour.'],
['Science',3,2,'What is the powerhouse of the cell?','Mitochondria',['Nucleus','Ribosome','Vacuole'],'Mitochondria release energy from food.'],
['Science',3,3,'What is the chemical symbol for sodium?','Na',['So','S','Sd'],'Na comes from the Latin natrium.'],
['Science',4,2,'What is the unit of electrical resistance?','Ohm',['Volt','Watt','Ampere'],'Resistance is measured in ohms.'],
['Science',4,3,'Which law states F = ma?','Newton’s second law',['Newton’s first law','Ohm’s law','Boyle’s law'],'Force equals mass times acceleration.'],
['Geography',1,1,'Which is the largest ocean?','Pacific',['Atlantic','Indian','Arctic'],'The Pacific covers about a third of Earth.'],
['Geography',1,2,'On which continent is Egypt?','Africa',['Asia','Europe','South America'],'Egypt is in north-east Africa.'],
['Geography',2,1,'What is the capital of France?','Paris',['Lyon','Marseille','Nice'],'Paris is on the River Seine.'],
['Geography',2,2,'Which river flows through London?','Thames',['Severn','Mersey','Clyde'],'The Thames runs through London.'],
['Geography',3,2,'Which is the longest river in Africa?','Nile',['Congo','Niger','Zambezi'],'The Nile is about 6,650 km long.'],
['Geography',3,3,'Which is the largest hot desert?','Sahara',['Gobi','Kalahari','Arabian'],'The Sahara covers much of northern Africa.'],
['Geography',4,2,'Which line is 0° latitude?','Equator',['Prime Meridian','Tropic of Cancer','Date Line'],'The Equator divides north from south.'],
['Geography',4,3,'What is the capital of Kazakhstan?','Astana',['Almaty','Tashkent','Bishkek'],'Astana has been the capital since 1997, renamed back in 2022.'],
['English',1,1,'Which word is a noun?','Dog',['Run','Quickly','Blue'],'A noun names a person, animal, place or thing.'],
['English',1,2,'What is the plural of “child”?','Children',['Childs','Childes','Childrens'],'Child has an irregular plural.'],
['English',2,1,'Which word is a verb?','Jump',['Table','Happy','Under'],'A verb is an action word.'],
['English',2,2,'Which word is a synonym of “happy”?','Joyful',['Gloomy','Angry','Tired'],'Synonyms have similar meanings.'],
['English',3,2,'Which is a simile?','As brave as a lion',['The wind howled','Time is money','He is a rock'],'Similes compare using “as” or “like”.'],
['English',3,3,'Which sentence is correct?','Their car is over there.',['There car is over their.','Their car is over their.','They’re car is over there.'],'Their shows ownership; there shows place.'],
['English',4,2,'What is a metaphor?','A comparison without “like” or “as”',['A comparison using “like”','An exaggeration','A repeated sound'],'A metaphor says one thing is another.'],
['English',4,3,'Which uses a semicolon correctly?','I was tired; I kept working.',['I was; tired I kept working.','Although; I was tired.','I was tired; and working.'],'A semicolon joins two related independent clauses.'],
['History',1,1,'Who sailed to the Americas in 1492?','Christopher Columbus',['Marco Polo','Captain Cook','Magellan'],'Columbus landed in the Caribbean in 1492.'],
['History',1,2,'What did the ancient Romans build to carry water?','Aqueducts',['Skyscrapers','Canals of ice','Railways'],'Aqueducts carried water to cities.'],
['History',2,1,'Which civilisation built the pyramids at Giza?','Ancient Egyptians',['Romans','Greeks','Aztecs'],'They were built for pharaohs over 4,000 years ago.'],
['History',2,2,'In which year did World War II end?','1945',['1939','1918','1950'],'The war ended in 1945.'],
['History',3,2,'Who was the first US President?','George Washington',['Thomas Jefferson','John Adams','Abraham Lincoln'],'Washington served from 1789 to 1797.'],
['History',3,3,'The French Revolution began in which year?','1789',['1776','1804','1815'],'The Bastille was stormed in July 1789.'],
['History',4,2,'Which wall fell in 1989?','The Berlin Wall',['The Great Wall','Hadrian’s Wall','The Western Wall'],'Its fall led to German reunification in 1990.'],
['History',4,3,'Which treaty ended World War I with Germany?','Treaty of Versailles',['Treaty of Paris','Treaty of Vienna','Treaty of Tordesillas'],'It was signed in 1919.']];
const SUBJ=[['Maths','Maths'],['Science','Science'],['Geography','Geography'],['English','English'],['History','History'],['Mixed','Mixed (all subjects)']],GR=Array.from({length:12},(_,i)=>[i+1,'Grade '+(i+1)]),LV=[[1,'Easy'],[2,'Medium'],[3,'Hard']],LVN={1:'easy',2:'medium',3:'hard'};
const opts=(a,c)=>a.map(([v,l])=>`<option value="${v}" ${v==c?'selected':''}>${l}</option>`).join('');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mkq(x){const o=[x[4],...x[5]].map((t,i)=>({t,c:!i})).sort(()=>Math.random()-.5);return{q:x[3],o:o.map(z=>z.t),a:o.findIndex(z=>z.c),e:x[6],s:x[0]}}
function pool(s,g,l){const b=Math.ceil(g/3);return BANK.filter(x=>x[0]==s).map(x=>({k:Math.abs(x[1]-b)*2+Math.abs(x[2]-l)+Math.random()*.5,x})).sort((a,b)=>a.k-b.k).map(o=>mkq(o.x))}
function mathQ(g,l){const d=Math.ceil(g/3)-1;let q,a;
 if(d==0){let x=rnd(1,10*l+4),y=rnd(1,10*l+4);if(Math.random()<.5){q=`${x} + ${y} = ?`;a=x+y}else{if(y>x)[x,y]=[y,x];q=`${x} − ${y} = ?`;a=x-y}}
 else if(d==1){const x=rnd(2,5+3*l),y=rnd(2,5+3*l);q=`${x} × ${y} = ?`;a=x*y}
 else if(d==2){const p=[10,20,25,50][rnd(0,3)],n=rnd(1,4*l);q=`What is ${p}% of ${n*20}?`;a=p*n/5}
 else{const x=rnd(2,4+3*l),m=rnd(2,2+2*l),b=rnd(1,15);q=`Solve for x: ${m}x + ${b} = ${m*x+b}`;a=x}
 const ds=new Set();while(ds.size<3){const v=a+[-10,-2,-1,1,2,10][rnd(0,5)];if(v!=a&&v>=0)ds.add(v)}
 return mkq(['Maths',0,0,q,String(a),[...ds].map(String),`The answer is ${a}.`])}
function buildPractice(s,g,l,n){const subs=s=='Mixed'?['Maths','Science','Geography','English','History']:[s],L={};subs.forEach(x=>{if(x!='Maths')L[x]=pool(x,g,l)});const qs=[];let i=0,guard=0;
 while(qs.length<n&&guard++<400){const x=subs[i++%subs.length];if(x=='Maths')qs.push(mathQ(g,l));else if(L[x].length)qs.push(L[x].shift())}return qs}
function rd(){const n=$('#pn');if(n)S.pr.n=Math.max(1,Math.min(20,+n.value||5))}
function startPractice(){rd();const p=S.pr,qs=buildPractice(p.subj,+p.grade,+p.lvl,+p.n);if(!qs.length){S.note='No questions found for those settings.';return render()}
 PQ={id:'p-'+p.subj,title:'Practice',subj:p.subj,qs,short:qs.length<p.n};begin(PQ.id)}
async function aiPractice(){rd();const p=S.pr;if(!S.key)return;S.note='Generating…';render();
 try{const j=JSON.parse((await gem(`Write ${p.n} multiple-choice questions on ${p.subj=='Mixed'?'a mix of school subjects':p.subj} for grade ${p.grade} students, difficulty ${LVN[p.lvl]}. Return only JSON: {"questions":[{"q":"","o":["","","",""],"a":0,"e":""}]}`,1)).replace(/```json|```/g,'').trim());
 const qs=j.questions.filter(q=>q.o&&q.o.length==4&&q.a>=0&&q.a<4).map(q=>({...q,s:p.subj=='Mixed'?'General':p.subj}));if(!qs.length)throw new Error('The AI returned no usable questions.');
 PQ={id:'ai-'+p.subj,title:'AI practice',subj:p.subj,qs};S.note='';begin(PQ.id)}catch(e){S.note=e instanceof SyntaxError?'The AI reply wasn’t valid. Try again.':gerr(e);render()}}
function practiceCard(){const p=S.pr;return `<div class="card"><h2>Custom practice</h2><p class="muted">Choose a subject, your grade, the level and how many questions. No AI key needed.</p>
<div class="grid"><div><label for="ps">Subject</label><select id="ps" onchange="S.pr.subj=this.value;save()">${opts(SUBJ,p.subj)}</select></div>
<div><label for="pg">Grade</label><select id="pg" onchange="S.pr.grade=+this.value;save()">${opts(GR,p.grade)}</select></div>
<div><label for="pl">Level</label><select id="pl" onchange="S.pr.lvl=+this.value;save()">${opts(LV,p.lvl)}</select></div>
<div><label for="pn">Number of questions (1–20)</label><input id="pn" type="number" min="1" max="20" value="${p.n}"></div></div>
<div class="row" style="margin-top:12px"><button class="pri" onclick="startPractice()">Start practice</button><button onclick="aiPractice()" ${S.key?'':'disabled'}>Generate with AI</button></div>
<p class="muted" role="status">${esc(S.note)||(S.key?'AI generation is on.':'AI generation is off. Add your own key in Tutor to turn it on. Everything else works without it.')}</p></div>`}
function vPlay(){return practiceCard()+`<h2>Extra quizzes (general knowledge, not curriculum-based)</h2><p class="muted">Self-paced play. Replaying the same quiz earns less XP.</p>`+S.quizzes.map(z=>`<div class="card row"><div><h3>${esc(z.title)}</h3><span class="muted">${esc(z.subj)} • ${z.qs.length} questions • played ${S.plays[z.id]||0}×</span></div><button class="pri" onclick="begin(${z.id})">Start</button></div>`).join('')}

function begin(id,opp){clearInterval(T);clearTimeout(OT);const qz=PQ&&PQ.id==id?PQ:S.quizzes.find(x=>x.id==id);
 S.game={qz,i:0,score:0,ok:0,streak:0,best:0,left:15,pw:{f:1,d:1},dbl:false,hide:[],sel:null,opp:opp||null,os:opp&&opp.theirScore!=null?opp.theirScore:0,oi:0,wrong:[],done:false,xp:[]};startQ()}
function startQ(){const g=S.game;g.left=15;g.sel=null;g.hide=[];g.dbl=false;render();clearInterval(T);T=setInterval(tick,1000);
 if(g.opp)OT=setTimeout(oppStep,2500+Math.random()*8000)}
function tick(){const g=S.game;g.left--;if(g.left<=0)return pick(-1);const e=$('#tm');if(e){e.textContent=g.left+'s';$('#tb').style.width=g.left/15*100+'%'}}
function oppStep(){const g=S.game;if(!g||!g.opp||g.opp.real||g.done||g.oi>g.i)return;g.oi++;if(Math.random()<g.opp.s)g.os+=100+Math.round(Math.random()*70);const e=$('#opp');if(e)e.textContent=`@${g.opp.u}: ${g.os} pts (${g.oi}/${g.qz.qs.length})`}
function pick(k){const g=S.game;if(g.sel!=null)return;clearInterval(T);g.sel=k;const q=g.qz.qs[g.i],sj=q.s||g.qz.subj,st=S.stats[sj]=S.stats[sj]||{c:0,t:0};st.t++;
 if(k==q.a){g.ok++;st.c++;g.streak++;g.best=Math.max(g.best,g.streak);g.score+=(100+g.left*4+Math.min(g.streak,5)*10)*(g.dbl?2:1)}else{g.streak=0;g.wrong.push(q)}render()}
function fifty(){const g=S.game,q=g.qz.qs[g.i];if(!g.pw.f||g.sel!=null||q.o.length<4)return;g.pw.f=0;g.hide=q.o.map((_,i)=>i).filter(i=>i!=q.a).sort(()=>Math.random()-.5).slice(0,2);render()}
function dbl(){const g=S.game;if(!g.pw.d||g.sel!=null)return;g.pw.d=0;g.dbl=true;render()}
function nextQ(){const g=S.game;clearTimeout(OT);if(g.opp&&g.oi<=g.i)oppStep();g.i++;if(g.i>=g.qz.qs.length)return finish();startQ()}
function finish(){const g=S.game,id=g.qz.id;g.done=true;clearInterval(T);if(g.qz.topic){const m=S.mast[g.qz.topic]=S.mast[g.qz.topic]||{c:0,t:0};m.c+=g.ok;m.t+=g.qz.qs.length}g.wrong.forEach(q=>addCard({...q,s:q.s||g.qz.subj}));
 const pl=S.plays[id]||0,f=Math.max(.25,1/(1+pl));S.plays[id]=pl+1;
 g.xp.push(['Quiz, accuracy and streak',Math.round((10+5*g.ok+2*Math.min(g.best,5))*f)]);
 if(pl>0&&g.score>(S.bests[id]||0))g.xp.push(['Beat your previous score',5]);
 S.bests[id]=Math.max(S.bests[id]||0,g.score);
 if(g.opp){g.xp.push(['Duel played',10]);duelSave(g)}
 g.xp.forEach(([s,a])=>add(s,a));render()}
function vGame(){const g=S.game,n=g.qz.qs.length;
 if(g.done){const pend=g.opp&&g.opp.real&&g.opp.theirScore==null,w=pend?`Score saved for your duel with @${g.opp.u}`:g.opp?(g.score>g.os?'You won the duel!':g.score==g.os?'Draw!':`@${g.opp.u} won this one.`):'Quiz complete';

muldiv:[['Multiplication facts','Multiplication is repeated addition: 6 × 4 means six fours. Learn the tables because division is the inverse.'],['Using facts','If 7 × 8 = 56 then 56 ÷ 8 = 7 and 56 ÷ 7 = 8.']],

frac:[['Fractions of amounts','To find 3/4 of 20, divide by the denominator (20 ÷ 4 = 5) then multiply by the numerator (5 × 3 = 15).'],['Equivalent fractions','Multiply the top and bottom by the same number: 1/2 = 2/4 = 3/6.']],
fdp:[['Fractions, decimals and percentages','These are three ways to write the same amount. 1/2 = 0.5 = 50%. Percent means out of 100.'],['Percentages of amounts','10% is the amount ÷ 10. Build other percentages from it: 25% of 80 is 20 because 25% is a quarter.']],
ratio:[['Ratio','A ratio compares parts. 2:3 means 2 parts to 3 parts. Simplify by dividing both sides by a common factor.'],['Sharing in a ratio','Add the parts, divide the total by that number to find one part, then multiply.']],
alg:[['Using letters','A letter stands for an unknown number. 3x means 3 × x. To solve an equation, do the same to both sides to get x alone.'],['Expanding and factorising','Expanding multiplies out brackets: 3(x + 4) = 3x + 12. Factorising is the reverse.']],
meas:[['Units','Learn the conversions: 100 cm = 1 m, 1000 m = 1 km, 1000 g = 1 kg. Multiply to go to a smaller unit.'],['Perimeter','Perimeter is the distance around a shape. For a rectangle add all four sides, or 2 × (length + width).']],
geo:[['Angles','Angles in a triangle add to 180°. Angles on a straight line add to 180°. Angles around a point add to 360°.'],['Area','Rectangle: length × width. Triangle: half × base × height. At KS4, Pythagoras says a² + b² = c² in a right-angled triangle.']],
shape:[['2D shapes','Name shapes by their sides: triangle 3, square and rectangle 4, pentagon 5, hexagon 6, octagon 8.'],['Describing shapes','Count sides and corners, and look for equal sides and right angles.']],
stat:[['Averages','Mean: add all values and divide by how many. Median: the middle value when ordered. Mode: the most common.'],['Range','Range is the largest value minus the smallest. It measures how spread out the data is.']],
prob:[['Probability','Probability is between 0 (impossible) and 1 (certain). It equals favourable outcomes ÷ total outcomes.'],['Complement','The probability of something not happening is 1 minus the probability that it happens.']]};

/* ====== Daily target, streak, reminders ====== */
const txp=()=>{const d=new Date();d.setHours(0,0,0,0);return S.ledger.filter(l=>l.ts>=+d&&!/^Synced/.test(l.src)).reduce((a,l)=>a+l.amt,0)};
function streak(){const by={},tg=S.target||50;S.ledger.forEach(l=>{if(/^Synced/.test(l.src))return;const k=new Date(l.ts).toDateString();by[k]=(by[k]||0)+l.amt});let n=0,d=new Date();if((by[d.toDateString()]||0)<tg)d.setDate(d.getDate()-1);while((by[d.toDateString()]||0)>=tg){n++;d.setDate(d.getDate()-1)}return n}
function remItem(){if(!S.remind)return'';const d=new Date(),hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2),left=(S.target||50)-txp();return hm>=(S.rtime||'18:00')&&left>0?`Reminder: ${left} XP left to reach today’s target.`:''}
function remTick(){if(!S.remind)return;const k=new Date().toDateString(),m=remItem();if(m&&S.rlast!=k){S.rlast=k;if(S.notif&&window.Notification&&Notification.permission=='granted'){try{new Notification('Quizlane',{body:m})}catch(e){}}if(!S.game)render()}}
function dlIcs(){const t=(S.rtime||'18:00').split(':'),d=new Date(),p=n=>('0'+n).slice(-2),dt=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(t[0])}${p(t[1])}00`;
 const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Quizlane//EN','BEGIN:VEVENT','UID:quizlane-daily@'+location.host,'DTSTAMP:'+dt,'DTSTART:'+dt,'DURATION:PT15M','RRULE:FREQ=DAILY','SUMMARY:Quizlane: reach your daily target ('+(S.target||50)+' XP)','DESCRIPTION:Open '+location.href,'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Quizlane daily target','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='quizlane-daily.ics';a.click()}

/* ====== Flashcards (Leitner boxes) ====== */
let CS=0;
const day=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function addCard(q){if(!q||!q.o||S.cards.some(c=>c.q==q.q))return;S.cards.push({q:q.q,a:q.o[q.a],e:q.e||'',s:q.s||'',b:0,d:day()});if(S.cards.length>500)S.cards.shift()}
const dueCards=()=>S.cards.filter(c=>c.d<=day());
function rate(ok){const c=dueCards()[0];if(!c)return;CS=0;if(ok){c.b=Math.min(4,c.b+1);c.d=day()+[0,1,2,4,8][c.b];add('Flashcard review',1)}else{c.b=0;c.d=day();S.cards=S.cards.filter(x=>x!==c);S.cards.push(c)}render()}
function vCards(){const d=dueCards(),c=d[0];return `<h2>Flashcards</h2><p class="muted">${S.cards.length} cards • ${d.length} due today. Questions you miss are added automatically, and you can add a whole lesson.</p>`+(c?`<div class="card" style="text-align:center"><p class="muted">${esc(c.s)}</p><div class="q">${esc(c.q)}</div>${CS?`<p><b>${esc(c.a)}</b></p><p class="muted">${esc(c.e)}</p><button class="pri" onclick="rate(1)">Got it</button> <button onclick="rate(0)">Again</button>`:`<button class="pri" onclick="CS=1;render()">Show answer</button>`}</div>`:`<div class="card"><p>${S.cards.length?'All caught up for today.':'No cards yet. Finish a lesson or miss a question to create some.'}</p></div>`)}

/* ====== Seneca-style lesson player: read a short section, answer questions, build mastery ====== */
let LP=null;
function openLesson(s,k,t){const key=tk(s,k,t),L=S.lessons[key];let secs,qs;
 if(L){secs=L.sections;qs=L.qs}else if(s=='Maths'){secs=NOTES[kindOf(t)].map(([h,p])=>({h,p}));qs=genQs(t,S.yr||5,2,6)}
 else if(S.key)return aiTopic(s,k,t,8,false,true);else{S.note='Lessons for this subject need your own AI key (Tutor tab). Maths lessons are built in.';return render()}
 LP={key,s,k,t,secs,qs,si:0,qi:0,per:Math.max(1,Math.ceil(qs.length/secs.length)),stage:'read',sel:null,ok:0,miss:[],done:false,added:false};render()}
function vLP(){const L=LP,n=L.qs.length,sec=L.secs[L.si],pr=L.done?100:Math.round(100*L.qi/n);
 const head=`<button onclick="LP=null;render()">Exit lesson</button><div class="bar" style="margin:10px 0"><i style="width:${pr}%"></i></div><p class="muted">${esc(L.s)} • ${esc(L.t)} • section ${Math.min(L.si+1,L.secs.length)} of ${L.secs.length}</p>`;
 if(L.done){const p=Math.round(100*L.ok/n);return head+`<div class="card"><h2>Lesson complete</h2><p>${L.ok} of ${n} correct (${p}%) ${'★'.repeat(p>=80?3:p>=50?2:1)}</p>${L.miss.length?`<p class="muted">${L.miss.length} missed question${L.miss.length>1?'s were':' was'} added to your flashcards.</p>`:''}<button class="pri" onclick="LP=null;render()">Done</button> <button onclick="LP.qs.forEach(q=>addCard({...q,s:LP.s}));LP.added=true;render()" ${L.added?'disabled':''}>${L.added?'Added to flashcards':'Add all questions to flashcards'}</button></div>`}
 if(L.stage=='read')return head+`<div class="card"><h2>${esc(sec.h)}</h2><p>${esc(sec.p)}</p><button class="pri" onclick="lpNext()">Continue</button></div>`;
 const q=L.qs[L.qi],a=L.sel!=null;
 return head+`<div class="card"><div class="q">${esc(q.q)}</div><div class="grid">${q.o.map((o,i)=>`<button class="tile t${i} ${a&&i==q.a?'ok':''} ${a&&i!=q.a?'no':''}" ${a?'disabled':''} onclick="lpPick(${i})"><span class="sym">${SYM[i]}</span>${esc(o)}</button>`).join('')}</div>${a?`<p><span class="${L.sel==q.a?'ok-t':'bad-t'}">${L.sel==q.a?'Correct':'Not quite'}.</span> ${esc(q.e||'')}</p><button class="pri" onclick="lpNext()">${L.qi+1>=n?'Finish':'Next'}</button>`:''}</div>`}
function lpPick(i){const L=LP;if(L.sel!=null)return;L.sel=i;const q=L.qs[L.qi];if(i==q.a)L.ok++;else{L.miss.push(q);addCard({...q,s:L.s})}render()}
function lpNext(){const L=LP;if(L.stage=='read'){L.stage='q';return render()}
 L.sel=null;L.qi++;if(L.qi>=L.qs.length){L.done=true;const m=S.mast[L.key]=S.mast[L.key]||{c:0,t:0};m.c+=L.ok;m.t+=L.qs.length;add('Lesson: '+L.t,10+3*L.ok);return render()}
 if(L.qi>=(L.si+1)*L.per&&L.si+1<L.secs.length){L.si++;L.stage='read'}render()}

/* ====== Learn page ====== */
function vLearn(){if(LP)return vLP();const y=S.yr||5,ks=KS(y),tx=txp(),tg=S.target||50,rm=remItem(),dc=dueCards().length;
 const goal=`<div class="card"><div class="row"><b>Daily target</b><span class="muted">${tx} / ${tg} XP • streak ${streak()} day${streak()==1?'':'s'}</span></div><div class="bar" style="margin:8px 0"><i style="width:${Math.min(100,tx/tg*100)}%"></i></div>${rm?`<p class="bad-t">${esc(rm)}</p>`:tx>=tg?'<p class="ok-t">Target reached. Well done!</p>':`<p class="muted">${tg-tx} XP to go. Change the target or reminder time in Settings.</p>`}${dc?`<button onclick="go('cards')">Review ${dc} flashcard${dc==1?'':'s'}</button>`:''}</div>`;
 const sub=S.ls&&CUR[S.ls]&&CUR[S.ls][ks]?S.ls:'';
 const h=`<h2>Learn</h2><p class="muted">Topics follow the England national curriculum programmes of study, grouped by key stage. This is an independent study aid, not an official DfE product (official source: gov.uk, “The national curriculum”).</p>${goal}<div class="card"><label for="yr">Year group</label><select id="yr" onchange="S.yr=+this.value;S.pr.grade=S.yr;S.ls='';render()">${opts(Array.from({length:11},(_,i)=>[i+1,'Year '+(i+1)+' (KS'+KS(i+1)+')']),y)}</select></div>`;
 if(!sub)return h+`<div class="grid">`+Object.keys(CUR).filter(s=>CUR[s][ks]).map(s=>{const ts=CUR[s][ks].split('|'),a=Math.round(ts.reduce((n,t)=>n+pct(tk(s,ks,t)),0)/ts.length);return `<button class="card" style="text-align:left" onclick="S.ls='${esc(s)}';render()"><h3>${esc(s)}</h3><div class="bar"><i style="width:${a}%"></i></div><span class="muted">${a}% mastery • ${ts.length} topics</span></button>`}).join('')+`</div>`;
 return h+`<button onclick="S.ls='';render()">All subjects</button><h2 style="margin-top:12px">${esc(sub)}</h2><p class="muted" role="status">${esc(S.note)}</p>`+CUR[sub][ks].split('|').map(t=>{const k=tk(sub,ks,t),p=pct(k),can=sub=='Maths'||S.key||S.lessons[k];return `<div class="card"><div class="row"><div><h3>${esc(t)}</h3><span class="muted">${p}% mastery ${'★'.repeat(p>=80?3:p>=50?2:p>0?1:0)}</span></div><div><button class="pri" onclick="openLesson('${esc(sub)}',${ks},'${esc(t)}')" ${can?'':'disabled title="Needs your AI key"'}>Lesson</button> <button onclick="runTopic('${esc(sub)}',${ks},'${esc(t)}',10,2)">Practise</button></div></div><div class="bar" style="margin-top:8px"><i style="width:${p}%"></i></div></div>`}).join('')+(S.key?'':'<p class="muted">Maths lessons and practice are built in. Other subjects need your own AI key (Tutor tab) to write lessons and questions for the topic.</p>')}

async function aiTopic(s,k,t,n,play,openL){if(!S.key)return;S.note='Writing your '+(play?'questions':'lesson')+'…';render();
 try{const j=JSON.parse(clean(await gem(`You write for pupils in England following the National Curriculum programme of study. Key Stage ${k}, Year ${S.yr}, subject ${s}, topic "${t}". Only include content that belongs to this topic and key stage in that programme of study; nothing from other topics or key stages. Use British spelling and UK contexts. Return only JSON: {"sections":[{"h":"","p":""}],"questions":[{"q":"","o":["","","",""],"a":0,"e":""}]} with 3 short sections and exactly ${Math.max(6,n)} questions, each with one correct option and a one-sentence explanation.`,1)));
  const qs=(j.questions||[]).filter(q=>q.o&&q.o.length==4&&q.a>=0&&q.a<4);if(!qs.length||!j.sections)throw new Error('The AI returned no usable lesson.');
  S.lessons[tk(s,k,t)]={sections:j.sections,qs};S.note='';if(play)return runTopic(s,k,t,n,S.pr.lvl,true);if(openL)return openLesson(s,k,t)}
 catch(e){S.note=e instanceof SyntaxError?'The AI reply wasn’t valid. Try again.':gerr(e)}render()}
function runTopic(s,k,t,n,l,fresh){const L=S.lessons[tk(s,k,t)],y=S.yr||5;let qs=[];
 if(s=='Maths')qs=genQs(t,y,l,n);
 else if(L&&(L.qs.length>=n||!S.key||fresh))qs=L.qs.slice(0,n).map(q=>({...q,s}));
 else if(S.key)return aiTopic(s,k,t,n,true);
 if(!qs.length){S.tab=S.tab=='learn'?'learn':S.tab;S.note='Questions for '+s+' need your own AI key (Tutor tab). Maths has built-in curriculum practice.';return render()}
 PQ={id:'t-'+tk(s,k,t),title:t,subj:s,qs,topic:tk(s,k,t),short:qs.length<n};begin(PQ.id)}

/* ====== Practice tab: curriculum topic picker ====== */
function curSel(){rd();const p=S.pr,y=+p.grade,ks=KS(y),subs=Object.keys(CUR).filter(s=>CUR[s][ks]),sub=subs.includes(p.subj)?p.subj:subs[0],ts=CUR[sub][ks].split('|');S.yr=y;return[sub,ks,ts[p.ti||0]||ts[0],+p.n,+p.lvl]}
function startPractice(){const[s,k,t,n,l]=curSel();runTopic(s,k,t,n,l)}
function aiGo(){const[s,k,t,n]=curSel();if(S.key)aiTopic(s,k,t,n,true)}
function practiceCard(){const p=S.pr,y=+p.grade,ks=KS(y),subs=Object.keys(CUR).filter(s=>CUR[s][ks]),sub=subs.includes(p.subj)?p.subj:subs[0],ts=CUR[sub][ks].split('|');
 return `<div class="card"><h2>Curriculum practice</h2><p class="muted">Questions come only from the England national curriculum topic you choose. Maths is built in; other subjects use your AI key.</p>
<div class="grid"><div><label for="pg">Year group</label><select id="pg" onchange="rd();S.pr.grade=+this.value;S.yr=+this.value;S.pr.ti=0;render()">${opts(Array.from({length:11},(_,i)=>[i+1,'Year '+(i+1)+' (KS'+KS(i+1)+')']),y)}</select></div>
<div><label for="ps">Subject</label><select id="ps" onchange="rd();S.pr.subj=this.value;S.pr.ti=0;render()">${opts(subs.map(s=>[s,s]),sub)}</select></div>
<div><label for="pt">Topic</label><select id="pt" onchange="S.pr.ti=+this.value;save()">${opts(ts.map((t,i)=>[i,t]),Math.min(p.ti||0,ts.length-1))}</select></div>
<div><label for="pl">Level</label><select id="pl" onchange="S.pr.lvl=+this.value;save()">${opts(LV,p.lvl)}</select></div>
<div><label for="pn">Number of questions (1–20)</label><input id="pn" type="number" min="1" max="20" value="${p.n}"></div></div>
<div class="row" style="margin-top:12px"><button class="pri" onclick="startPractice()">Start practice</button><button onclick="aiGo()" ${S.key?'':'disabled'}>Generate with AI</button></div>
<p class="muted" role="status">${esc(S.note)||(S.key?'AI is on for non-Maths topics.':'Non-Maths topics need your AI key (Tutor tab).')}</p></div>`}

applyTheme();setInterval(remTick,60000);render();init();
</script></body></html>
