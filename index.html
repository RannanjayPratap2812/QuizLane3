html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}

nav button{flex:1;min-width:64px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
button.on,button.pri{background:var(--pri);color:var(--on,#fff)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--mute);font-size:14px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.tile{display:flex;gap:10px;align-items:center;text-align:left;border:0;color:#fff;padding:16px;font-size:17px;border-radius:12px;box-shadow:0 5px 0 rgba(0,0,0,.28);min-height:64px}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.t0{background:#3a3df0}.t1{background:#d93a55}.t2{background:#0f8a62}.t3{background:#ffe14d;color:#14152b}
.tile.ok{outline:4px solid var(--ok);outline-offset:2px}.tile.no{opacity:.45}.tile.hid{visibility:hidden}
.sym{font-size:22px;width:28px;text-align:center}
.q{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:14px 0}
.lb{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lb b:first-child{width:28px}.lb span{flex:1}
.me{background:var(--hi);color:#14152b;border-radius:8px;padding:8px;border:0}
.msg{padding:8px 12px;border-radius:10px;margin:6px 0;max-width:90%}
.u{background:var(--pri);color:var(--bg);margin-left:auto}.a{background:var(--line)}
.ok-t{color:var(--ok);font-weight:800}.bad-t{color:var(--bad);font-weight:800}
label{display:block;font-weight:600;margin:8px 0 4px;font-size:14px}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SYM=['▲','◆','●','■'];
const TF=['True','False'];
const BOTS=[{u:'maya_r',m:1240,f:1,s:.85},{u:'sam.k',m:980,f:1,s:.75},{u:'lin_88',m:860,f:0,s:.7},{u:'priya_s',m:720,f:0,s:.65},{u:'dev_t',m:510,f:1,s:.6},{u:'zoe.codes',m:300,f:0,s:.55},{u:'omar_h',m:150,f:0,s:.5}];
const QZ=[
{id:1,title:'Solar System Basics',subj:'Science',qs:[
{q:'Which planet is closest to the Sun?',o:['Mercury','Venus','Earth','Mars'],a:0,e:'Mercury orbits about 58 million km from the Sun.'},

{q:'Which is the largest planet?',o:['Saturn','Jupiter','Neptune','Earth'],a:1,e:'Jupiter holds more than twice the mass of all other planets combined.'},

{id:2,title:'World Capitals',subj:'Geography',qs:[
{q:'What is the capital of Australia?',o:['Sydney','Melbourne','Canberra','Perth'],a:2,e:'Canberra was built as a compromise between Sydney and Melbourne.'},

{q:'Istanbul is the capital of Turkey.',o:TF,a:1,e:'The capital is Ankara.'},
{q:'What is the capital of Brazil?',o:['Rio de Janeiro','Brasília','São Paulo','Salvador'],a:1,e:'Brasília replaced Rio as capital in 1960.'},
{q:'What is the capital of Kenya?',o:['Nairobi','Mombasa','Kampala','Dodoma'],a:0,e:'Nairobi is Kenya’s capital and largest city.'}]},
{id:3,title:'Mental Math',subj:'Maths',qs:[
{q:'7 × 8 = ?',o:['54','56','58','64'],a:1,e:'7 × 8 = 56.'},
{q:'What is 15% of 200?',o:['20','25','30','35'],a:2,e:'10% is 20 and 5% is 10, so 30.'},

{q:'9² − 4² = ?',o:['55','65','45','75'],a:1,e:'81 − 16 = 65.'}]}];
let S={auth:'loading',mast:{},lessons:{},yr:5,theme:'auto',accent:'indigo',ls:'',lt:'',pr:{subj:'Maths',grade:5,lvl:2,n:10},user:'you_01',xp:0,ledger:[],plays:{},bests:{},stats:{},wl:{w:0,l:0},key:'',model:'gemini-2.5-flash',keyOk:null,reqs:0,pub:true,quizzes:QZ,tab:'learn',game:null,chat:[],draft:{title:'',subj:'',qs:[]},note:'',inv:'',lbf:'all',nid:10};
try{const o=JSON.parse(localStorage.getItem('ql')||'null');if(o)Object.assign(S,o)}catch(e){}
const save=()=>{try{const{game,tab,chat,note,inv,auth,...r}=S;localStorage.setItem('ql',JSON.stringify(r))}catch(e){}sync()};
let T,OT,PQ;
const lvl=()=>Math.floor(Math.sqrt(S.xp/50))+1;
const mxp=()=>{const d=new Date(),s=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1);return S.ledger.filter(l=>l.ts>=s).reduce((a,l)=>a+l.amt,0)};
const add=(src,amt)=>{if(amt<=0)return;S.ledger.push({src,amt,ts:Date.now()});S.xp+=amt};
const go=t=>{S.tab=t;S.note='';render()};

function render(){
 $('#nav').innerHTML=[['learn','Learn'],['play','Practice'],['duel','Friends'],['create','Create'],['ranks','Ranks'],['tutor','Tutor'],['set','Settings']].map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#me').textContent=`@${S.user} • Level ${lvl()} • ${S.xp} XP`;
 const gate=S.auth!='ready'&&S.auth!='offline';$('#nav').style.display=gate?'none':'';$('#main').innerHTML=gate?vGate():S.game?vGame():({learn:vLearn,set:vSet,play:vPlay,duel:vDuel,create:vCreate,ranks:vRanks,tutor:vTutor}[S.tab])();
 save();
}
const BANK=[
['Science',1,1,'What do plants need to grow?','Sunlight and water',['Only candy','Only darkness','Plastic'],'Plants use sunlight, water and air to make food.'],
['Science',1,2,'Which animal is a mammal?','Dolphin',['Shark','Trout','Eagle'],'Dolphins breathe air and feed milk to their young.'],
['Science',2,1,'What state of matter is ice?','Solid',['Liquid','Gas','Plasma'],'Ice is frozen water, a solid.'],
['Science',2,2,'Which planet is known as the Red Planet?','Mars',['Venus','Jupiter','Mercury'],'Iron oxide gives Mars its red colour.'],
['Science',3,2,'What is the powerhouse of the cell?','Mitochondria',['Nucleus','Ribosome','Vacuole'],'Mitochondria release energy from food.'],
['Science',3,3,'What is the chemical symbol for sodium?','Na',['So','S','Sd'],'Na comes from the Latin natrium.'],
['Science',4,2,'What is the unit of electrical resistance?','Ohm',['Volt','Watt','Ampere'],'Resistance is measured in ohms.'],
['Science',4,3,'Which law states F = ma?','Newton’s second law',['Newton’s first law','Ohm’s law','Boyle’s law'],'Force equals mass times acceleration.'],
['Geography',1,1,'Which is the largest ocean?','Pacific',['Atlantic','Indian','Arctic'],'The Pacific covers about a third of Earth.'],
['Geography',1,2,'On which continent is Egypt?','Africa',['Asia','Europe','South America'],'Egypt is in north-east Africa.'],
['Geography',2,1,'What is the capital of France?','Paris',['Lyon','Marseille','Nice'],'Paris is on the River Seine.'],
['Geography',2,2,'Which river flows through London?','Thames',['Severn','Mersey','Clyde'],'The Thames runs through London.'],
['Geography',3,2,'Which is the longest river in Africa?','Nile',['Congo','Niger','Zambezi'],'The Nile is about 6,650 km long.'],
['Geography',3,3,'Which is the largest hot desert?','Sahara',['Gobi','Kalahari','Arabian'],'The Sahara covers much of northern Africa.'],
['Geography',4,2,'Which line is 0° latitude?','Equator',['Prime Meridian','Tropic of Cancer','Date Line'],'The Equator divides north from south.'],
['Geography',4,3,'What is the capital of Kazakhstan?','Astana',['Almaty','Tashkent','Bishkek'],'Astana has been the capital since 1997, renamed back in 2022.'],
['English',1,1,'Which word is a noun?','Dog',['Run','Quickly','Blue'],'A noun names a person, animal, place or thing.'],
['English',1,2,'What is the plural of “child”?','Children',['Childs','Childes','Childrens'],'Child has an irregular plural.'],
['English',2,1,'Which word is a verb?','Jump',['Table','Happy','Under'],'A verb is an action word.'],
['English',2,2,'Which word is a synonym of “happy”?','Joyful',['Gloomy','Angry','Tired'],'Synonyms have similar meanings.'],
['English',3,2,'Which is a simile?','As brave as a lion',['The wind howled','Time is money','He is a rock'],'Similes compare using “as” or “like”.'],
['English',3,3,'Which sentence is correct?','Their car is over there.',['There car is over their.','Their car is over their.','They’re car is over there.'],'Their shows ownership; there shows place.'],
['English',4,2,'What is a metaphor?','A comparison without “like” or “as”',['A comparison using “like”','An exaggeration','A repeated sound'],'A metaphor says one thing is another.'],
['English',4,3,'Which uses a semicolon correctly?','I was tired; I kept working.',['I was; tired I kept working.','Although; I was tired.','I was tired; and working.'],'A semicolon joins two related independent clauses.'],
['History',1,1,'Who sailed to the Americas in 1492?','Christopher Columbus',['Marco Polo','Captain Cook','Magellan'],'Columbus landed in the Caribbean in 1492.'],
['History',1,2,'What did the ancient Romans build to carry water?','Aqueducts',['Skyscrapers','Canals of ice','Railways'],'Aqueducts carried water to cities.'],
['History',2,1,'Which civilisation built the pyramids at Giza?','Ancient Egyptians',['Romans','Greeks','Aztecs'],'They were built for pharaohs over 4,000 years ago.'],
['History',2,2,'In which year did World War II end?','1945',['1939','1918','1950'],'The war ended in 1945.'],
['History',3,2,'Who was the first US President?','George Washington',['Thomas Jefferson','John Adams','Abraham Lincoln'],'Washington served from 1789 to 1797.'],
['History',3,3,'The French Revolution began in which year?','1789',['1776','1804','1815'],'The Bastille was stormed in July 1789.'],
['History',4,2,'Which wall fell in 1989?','The Berlin Wall',['The Great Wall','Hadrian’s Wall','The Western Wall'],'Its fall led to German reunification in 1990.'],
['History',4,3,'Which treaty ended World War I with Germany?','Treaty of Versailles',['Treaty of Paris','Treaty of Vienna','Treaty of Tordesillas'],'It was signed in 1919.']];
const SUBJ=[['Maths','Maths'],['Science','Science'],['Geography','Geography'],['English','English'],['History','History'],['Mixed','Mixed (all subjects)']],GR=Array.from({length:12},(_,i)=>[i+1,'Grade '+(i+1)]),LV=[[1,'Easy'],[2,'Medium'],[3,'Hard']],LVN={1:'easy',2:'medium',3:'hard'};
const opts=(a,c)=>a.map(([v,l])=>`<option value="${v}" ${v==c?'selected':''}>${l}</option>`).join('');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mkq(x){const o=[x[4],...x[5]].map((t,i)=>({t,c:!i})).sort(()=>Math.random()-.5);return{q:x[3],o:o.map(z=>z.t),a:o.findIndex(z=>z.c),e:x[6],s:x[0]}}
function pool(s,g,l){const b=Math.ceil(g/3);return BANK.filter(x=>x[0]==s).map(x=>({k:Math.abs(x[1]-b)*2+Math.abs(x[2]-l)+Math.random()*.5,x})).sort((a,b)=>a.k-b.k).map(o=>mkq(o.x))}
function mathQ(g,l){const d=Math.ceil(g/3)-1;let q,a;
 if(d==0){let x=rnd(1,10*l+4),y=rnd(1,10*l+4);if(Math.random()<.5){q=`${x} + ${y} = ?`;a=x+y}else{if(y>x)[x,y]=[y,x];q=`${x} − ${y} = ?`;a=x-y}}
 else if(d==1){const x=rnd(2,5+3*l),y=rnd(2,5+3*l);q=`${x} × ${y} = ?`;a=x*y}
 else if(d==2){const p=[10,20,25,50][rnd(0,3)],n=rnd(1,4*l);q=`What is ${p}% of ${n*20}?`;a=p*n/5}
 else{const x=rnd(2,4+3*l),m=rnd(2,2+2*l),b=rnd(1,15);q=`Solve for x: ${m}x + ${b} = ${m*x+b}`;a=x}
 const ds=new Set();while(ds.size<3){const v=a+[-10,-2,-1,1,2,10][rnd(0,5)];if(v!=a&&v>=0)ds.add(v)}
 return mkq(['Maths',0,0,q,String(a),[...ds].map(String),`The answer is ${a}.`])}
function buildPractice(s,g,l,n){const subs=s=='Mixed'?['Maths','Science','Geography','English','History']:[s],L={};subs.forEach(x=>{if(x!='Maths')L[x]=pool(x,g,l)});const qs=[];let i=0,guard=0;
 while(qs.length<n&&guard++<400){const x=subs[i++%subs.length];if(x=='Maths')qs.push(mathQ(g,l));else if(L[x].length)qs.push(L[x].shift())}return qs}
function rd(){const n=$('#pn');if(n)S.pr.n=Math.max(1,Math.min(20,+n.value||5))}
function startPractice(){rd();const p=S.pr,qs=buildPractice(p.subj,+p.grade,+p.lvl,+p.n);if(!qs.length){S.note='No questions found for those settings.';return render()}
 PQ={id:'p-'+p.subj,title:'Practice',subj:p.subj,qs,short:qs.length<p.n};begin(PQ.id)}
async function aiPractice(){rd();const p=S.pr;if(!S.key)return;S.note='Generating…';render();
 try{const j=JSON.parse((await gem(`Write ${p.n} multiple-choice questions on ${p.subj=='Mixed'?'a mix of school subjects':p.subj} for grade ${p.grade} students, difficulty ${LVN[p.lvl]}. Return only JSON: {"questions":[{"q":"","o":["","","",""],"a":0,"e":""}]}`,1)).replace(/```json|```/g,'').trim());
 const qs=j.questions.filter(q=>q.o&&q.o.length==4&&q.a>=0&&q.a<4).map(q=>({...q,s:p.subj=='Mixed'?'General':p.subj}));if(!qs.length)throw new Error('The AI returned no usable questions.');
 PQ={id:'ai-'+p.subj,title:'AI practice',subj:p.subj,qs};S.note='';begin(PQ.id)}catch(e){S.note=e instanceof SyntaxError?'The AI reply wasn’t valid. Try again.':gerr(e);render()}}
function practiceCard(){const p=S.pr;return `<div class="card"><h2>Custom practice</h2><p class="muted">Choose a subject, your grade, the level and how many questions. No AI key needed.</p>
<div class="grid"><div><label for="ps">Subject</label><select id="ps" onchange="S.pr.subj=this.value;save()">${opts(SUBJ,p.subj)}</select></div>
<div><label for="pg">Grade</label><select id="pg" onchange="S.pr.grade=+this.value;save()">${opts(GR,p.grade)}</select></div>
<div><label for="pl">Level</label><select id="pl" onchange="S.pr.lvl=+this.value;save()">${opts(LV,p.lvl)}</select></div>
<div><label for="pn">Number of questions (1–20)</label><input id="pn" type="number" min="1" max="20" value="${p.n}"></div></div>
<div class="row" style="margin-top:12px"><button class="pri" onclick="startPractice()">Start practice</button><button onclick="aiPractice()" ${S.key?'':'disabled'}>Generate with AI</button></div>
<p class="muted" role="status">${esc(S.note)||(S.key?'AI generation is on.':'AI generation is off. Add your own key in Tutor to turn it on. Everything else works without it.')}</p></div>`}
function vPlay(){return practiceCard()+`<h2>Or pick a quiz</h2><p class="muted">Self-paced play. Replaying the same quiz earns less XP.</p>`+S.quizzes.map(z=>`<div class="card row"><div><h3>${esc(z.title)}</h3><span class="muted">${esc(z.subj)} • ${z.qs.length} questions • played ${S.plays[z.id]||0}×</span></div><button class="pri" onclick="begin(${z.id})">Start</button></div>`).join('')}

function begin(id,opp){clearInterval(T);clearTimeout(OT);const qz=PQ&&PQ.id==id?PQ:S.quizzes.find(x=>x.id==id);
 S.game={qz,i:0,score:0,ok:0,streak:0,best:0,left:15,pw:{f:1,d:1},dbl:false,hide:[],sel:null,opp:opp||null,os:opp&&opp.theirScore!=null?opp.theirScore:0,oi:0,wrong:[],done:false,xp:[]};startQ()}
function startQ(){const g=S.game;g.left=15;g.sel=null;g.hide=[];g.dbl=false;render();clearInterval(T);T=setInterval(tick,1000);
 if(g.opp)OT=setTimeout(oppStep,2500+Math.random()*8000)}
function tick(){const g=S.game;g.left--;if(g.left<=0)return pick(-1);const e=$('#tm');if(e){e.textContent=g.left+'s';$('#tb').style.width=g.left/15*100+'%'}}
function oppStep(){const g=S.game;if(!g||!g.opp||g.done||g.oi>g.i)return;g.oi++;if(Math.random()<g.opp.s)g.os+=100+Math.round(Math.random()*70);const e=$('#opp');if(e)e.textContent=`@${g.opp.u}: ${g.os} pts (${g.oi}/${g.qz.qs.length})`}
function pick(k){const g=S.game;if(g.sel!=null)return;clearInterval(T);g.sel=k;const q=g.qz.qs[g.i],sj=q.s||g.qz.subj,st=S.stats[sj]=S.stats[sj]||{c:0,t:0};st.t++;
 if(k==q.a){g.ok++;st.c++;g.streak++;g.best=Math.max(g.best,g.streak);g.score+=(100+g.left*4+Math.min(g.streak,5)*10)*(g.dbl?2:1)}else{g.streak=0;g.wrong.push(q)}render()}
function fifty(){const g=S.game,q=g.qz.qs[g.i];if(!g.pw.f||g.sel!=null||q.o.length<4)return;g.pw.f=0;g.hide=q.o.map((_,i)=>i).filter(i=>i!=q.a).sort(()=>Math.random()-.5).slice(0,2);render()}
function dbl(){const g=S.game;if(!g.pw.d||g.sel!=null)return;g.pw.d=0;g.dbl=true;render()}
function nextQ(){const g=S.game;clearTimeout(OT);if(g.opp&&g.oi<=g.i)oppStep();g.i++;if(g.i>=g.qz.qs.length)return finish();startQ()}
function finish(){const g=S.game,id=g.qz.id;g.done=true;clearInterval(T);if(g.qz.topic){const m=S.mast[g.qz.topic]=S.mast[g.qz.topic]||{c:0,t:0};m.c+=g.ok;m.t+=g.qz.qs.length}
 const pl=S.plays[id]||0,f=Math.max(.25,1/(1+pl));S.plays[id]=pl+1;
 g.xp.push(['Quiz, accuracy and streak',Math.round((10+5*g.ok+2*Math.min(g.best,5))*f)]);
 if(pl>0&&g.score>(S.bests[id]||0))g.xp.push(['Beat your previous score',5]);
 S.bests[id]=Math.max(S.bests[id]||0,g.score);
 if(g.opp){const pend=g.opp.real&&g.opp.theirScore==null,w=!pend&&g.score>g.os,t=!pend&&g.score==g.os;if(w)S.wl.w++;else if(!t&&!pend)S.wl.l++;g.xp.push([pend?'Challenge sent':w?'Duel win':t?'Duel draw':'Duel played',w?30:t?15:10]);duelSave(g)}
 g.xp.forEach(([s,a])=>add(s,a));render()}
function vGame(){const g=S.game,n=g.qz.qs.length;
 if(g.done){const pend=g.opp&&g.opp.real&&g.opp.theirScore==null,w=pend?`Challenge sent to @${g.opp.u}`:g.opp?(g.score>g.os?'You won the duel!':g.score==g.os?'Draw!':`@${g.opp.u} won this one.`):'Quiz complete';
  return `<div class="card"><h2>${w}</h2><p>Score <b>${g.score}</b>${g.opp&&!pend?` vs ${g.os}`:''} • ${g.ok}/${n} correct • best streak ${g.best}</p>

async function duelSave(g){const o=g.opp;if(!SB||!o||!o.real)return;const c=o.theirScore==null,ts=Date.now();
 await SB.from(c?'challenges':'replies').upsert(c?{from_id:UID,to_id:o.id,quiz_id:+g.qz.id,title:g.qz.title,score:g.score,from_name:S.user,ts}:{from_id:UID,to_id:o.id,score:g.score,from_name:S.user,ts});poll()}
function findF(){const u=$('#fs').value.trim().toLowerCase().replace(/^@/,''),r=LB.find(x=>x.username==u&&x.id!=UID);if(!r){S.inv='No player with that username yet.';return render()}S.inv='Added @'+u+'.';addF(r.id)}
function chal(id){const q=$('#dq').value;S.inv='';begin(q,{u:nm(id),id,real:true,theirScore:null})}
function playCh(cid){const c=CH.find(x=>x.id==cid);if(c)begin(c.quizId,{u:c.from,id:c.id,real:true,theirScore:c.score})}

function vDuel(){
 if(S.auth!='ready')return `<h2>Friends and duels</h2><div class="card"><p>Friends and duels need an account. You’re playing offline.</p><button class="pri" onclick="init()">Sign in</button></div>`;
 const fr=FR(),dir=LB.filter(r=>r.id!=UID&&!r.hidden&&!fr.includes(r.id)).slice(0,8),
 inc=CH.filter(c=>c.to==UID&&!RP.some(p=>p.id==UID&&p.to==c.id&&p.ts>=c.ts)),
 mine=CH.find(c=>c.id==UID),rep=mine&&RP.filter(p=>p.to==UID&&p.ts>=mine.ts)[0],
 qo=S.quizzes.filter(z=>z.id<=3).map(z=>`<option value="${z.id}">${esc(z.title)}</option>`).join(''),
 row=(r,f)=>`<div class="lb"><span>@${esc(r.username)} <span class="muted">Lv ${Math.floor(Math.sqrt((r.xp||0)/50))+1}${(FA[r.id]||[]).includes(UID)?' • added you':''}</span></span>${f?`<button class="pri" onclick="chal('${esc(r.id)}')">Challenge</button> <button onclick="delF('${esc(r.id)}')">Remove</button>`:`<button onclick="addF('${esc(r.id)}')">Add friend</button>`}</div>`;
 return `<h2>Friends and duels</h2><p class="muted">Real players with an account. Duels are async: you play, they play later, and scores are compared. AI help is off during duels.</p>
 ${inc.length?`<div class="card"><h3>Challenges for you</h3>`+inc.map(c=>`<div class="lb"><span>@${esc(c.from)} challenged you on ${esc(c.title)}</span><button class="pri" onclick="playCh('${esc(c.id)}')">Play</button></div>`).join('')+`</div>`:''}
 ${mine?`<div class="card"><h3>Your last challenge</h3>${rep?`@${esc(rep.from)} scored ${rep.score} vs your ${mine.score}: <b class="${rep.score<mine.score?'ok-t':rep.score>mine.score?'bad-t':''}">${rep.score<mine.score?'You won':rep.score>mine.score?'They won':'Draw'}</b>`:`Waiting for @${esc(nm(mine.to))} to play ${esc(mine.title)} (you scored ${mine.score}).`}</div>`:''}
 <div class="card"><h3>Your friends</h3><label for="dq">Quiz for challenges</label><select id="dq">${qo}</select>${fr.map(id=>LB.find(r=>r.id==id)).filter(Boolean).map(r=>row(r,1)).join('')||'<p class="muted">No friends yet. Add someone below.</p>'}<p class="muted">Duels: ${S.wl.w} won, ${S.wl.l} lost.</p></div>
 <div class="card"><h3>Find a player</h3><div class="row" style="flex-wrap:nowrap"><input id="fs" placeholder="Exact username" autocomplete="off"><button onclick="findF()">Add</button></div><p class="muted" role="status">${esc(S.inv)}</p>
 ${dir.length?'<h3 style="margin-top:12px">Other players</h3>'+dir.map(r=>row(r,0)).join(''):'<p class="muted">No other players have joined yet.</p>'}</div>`}


/* ====== Learn: England national curriculum by key stage ====== */
const CUR={
Maths:{1:'Number and place value|Addition and subtraction|Multiplication and division|Fractions|Measurement|Shape, position and direction',2:'Place value and rounding|The four operations|Fractions, decimals and percentages|Ratio and proportion|Algebra|Measurement|Geometry|Statistics',3:'Number and place value|Fractions, decimals and percentages|Algebra and equations|Ratio, proportion and rates of change|Geometry and measures|Probability|Statistics',4:'Number|Algebra|Ratio, proportion and rates of change|Geometry and measures|Probability|Statistics'},
English:{1:'Phonics and word reading|Comprehension|Spelling and handwriting|Writing composition|Grammar and punctuation|Spoken language',2:'Reading comprehension|Spelling and word roots|Writing for purpose and audience|Grammar and punctuation|Vocabulary|Spoken language',3:'Reading literature and Shakespeare|Poetry|Writing and editing|Grammar and vocabulary|Spoken English',4:'Shakespeare|The 19th-century novel|Poetry since 1789|Modern fiction and drama|Writing and rhetoric|Grammar and Standard English'},
Science:{1:'Plants|Animals including humans|Everyday materials|Seasonal changes|Living things and habitats',2:'Living things and habitats|Animals including humans|Rocks and fossils|Light and sound|Forces and magnets|States of matter|Electricity|Evolution and inheritance',3:'Cells and organisation|Genes, reproduction and ecosystems|Particles and the periodic table|Chemical reactions|Energy|Forces and motion|Waves|Electricity and magnetism',4:'Cell biology and organisation|Infection, homeostasis and inheritance|Ecology and bioenergetics|Atomic structure and bonding|Chemical changes and energy|Organic chemistry and the atmosphere|Forces, energy and electricity|Waves, particles and magnetism'},
History:{1:'Changes within living memory|Events beyond living memory|Significant people|Local history',2:'Stone Age to Iron Age Britain|Romans in Britain|Anglo-Saxons and Vikings|Ancient civilisations|Ancient Greece|A non-European society',3:'Medieval Britain 1066 to 1509|Tudors and Stuarts 1509 to 1745|Industry, empire and reform 1745 to 1901|The World Wars|Britain and the wider world',4:'Period and thematic studies|Modern depth studies|Historical interpretations and enquiry'},
Geography:{1:'UK and world geography|Weather and seasons|Hot and cold places|Maps and fieldwork',2:'The Americas and Europe|Climate zones and biomes|Rivers, mountains and volcanoes|Settlement and land use|Trade and resources|Map skills',3:'Africa, Asia and Russia|Plate tectonics|Weather and climate|Rivers and coasts|Population and urbanisation',4:'Natural hazards|Rivers and coasts|Ecosystems and climate change|Urban issues and development|Resource management|Fieldwork'},
Computing:{1:'Algorithms|Simple programs|Debugging|Using technology safely',2:'Sequence, selection and repetition|Variables and programming|Networks and the internet|Online safety',3:'Computational thinking|Programming in text languages|Binary and data|Hardware and software|Networks|Cyber security',4:'Computer systems|Programming and algorithms|Data and logic|Networks and cyber security|Impact of technology'},
'Design and Technology':{1:'Design, make and evaluate|Structures and mechanisms|Cooking and nutrition',2:'Mechanical and electrical systems|Structures|Cooking and nutrition|Textiles',3:'Design and prototyping|Materials and structures|Electronics and mechanisms|Cooking and nutrition',4:'Design principles|Materials and manufacturing|Electronics and systems'},
'Art and Design':{1:'Drawing and painting|Printmaking and collage|Famous artists',2:'Sketchbooks and techniques|Sculpture|Art history',3:'Drawing and painting|Sculpture and 3D|Art movements',4:'Developing ideas|Techniques and media|Critical study'},
Music:{1:'Singing and rhythm|Listening|Playing instruments',2:'Pitch and notation|Ensemble performance|Composition|History of music',3:'Notation and theory|Composition|Musical styles and history',4:'Performing|Composing|Listening and appraising'},
'Physical Education':{1:'Fundamental movement|Games|Dance',2:'Games and invasion sports|Gymnastics|Swimming and water safety|Outdoor activities',3:'Team sports|Athletics|Fitness and health',4:'Fitness|Sports skills|Leadership and wellbeing'},
Languages:{2:'Speaking and listening|Reading and writing|Grammar and vocabulary|Culture',3:'Grammar and structures|Vocabulary and themes|Translation|Culture and literature'},
Citizenship:{3:'Rights and responsibilities|Democracy and the UK system|Law and justice|Money and finance',4:'Government and politics|Law and human rights|Community and diversity|Personal finance'}};
const KS=y=>y<=2?1:y<=6?2:y<=9?3:4;
const pct=k=>{const m=S.mast[k];return m&&m.t?Math.round(100*m.c/m.t):0};
const tk=(s,k,t)=>s+'|'+k+'|'+t;
function vLearn(){const y=S.yr||5,ks=KS(y);
 if(S.lt&&S.lessons[S.lt]){const[sb,k,t]=S.lt.split('|'),L=S.lessons[S.lt];return `<button onclick="S.lt='';render()">Back</button><h2>${esc(t)}</h2><p class="muted">${esc(sb)}, Key Stage ${k}. AI-written lesson: check it against your textbook or teacher.</p>${L.sections.map(s=>`<div class="card"><h3>${esc(s.h)}</h3><p>${esc(s.p)}</p></div>`).join('')}<button class="pri" onclick="startTopic('${esc(sb)}',${k},'${esc(t)}')">Practise this topic</button>`}
 const sub=S.ls&&CUR[S.ls]&&CUR[S.ls][ks]?S.ls:'';
 const h=`<h2>Learn</h2><p class="muted">Topics follow the England national curriculum programmes of study, grouped by key stage. This is an independent study aid, not an official DfE product.</p><div class="card"><label for="yr">Year group</label><select id="yr" onchange="S.yr=+this.value;S.pr.grade=S.yr;S.ls='';render()">${opts(Array.from({length:11},(_,i)=>[i+1,'Year '+(i+1)+' (KS'+KS(i+1)+')']),y)}</select></div>`;
 if(!sub)return h+`<div class="grid">`+Object.keys(CUR).filter(s=>CUR[s][ks]).map(s=>{const ts=CUR[s][ks].split('|'),a=Math.round(ts.reduce((n,t)=>n+pct(tk(s,ks,t)),0)/ts.length);return `<button class="card" style="text-align:left" onclick="S.ls='${esc(s)}';render()"><h3>${esc(s)}</h3><div class="bar"><i style="width:${a}%"></i></div><span class="muted">${a}% mastery • ${ts.length} topics</span></button>`}).join('')+`</div>`;
 return h+`<button onclick="S.ls='';render()">All subjects</button><h2 style="margin-top:12px">${esc(sub)}</h2><p class="muted" role="status">${esc(S.note)}</p>`+CUR[sub][ks].split('|').map(t=>{const k=tk(sub,ks,t),p=pct(k);return `<div class="card"><div class="row"><div><h3>${esc(t)}</h3><span class="muted">${p}% mastery ${'★'.repeat(p>=80?3:p>=50?2:p>0?1:0)}</span></div><div><button onclick="lesson('${esc(sub)}',${ks},'${esc(t)}')" ${S.key||S.lessons[k]?'':'disabled title="Needs your AI key"'}>Lesson</button> <button class="pri" onclick="startTopic('${esc(sub)}',${ks},'${esc(t)}')">Practise</button></div></div><div class="bar" style="margin-top:8px"><i style="width:${p}%"></i></div></div>`}).join('')+(S.key?'':'<p class="muted">Lessons and questions for every topic need your own AI key (Tutor tab). Without one you still get built-in practice for Maths and the core topics in the question bank.</p>')}
function lesson(s,k,t){const key=tk(s,k,t);if(S.lessons[key]){S.lt=key;return render()}aiTopic(s,k,t)}
async function aiTopic(s,k,t){if(!S.key)return;S.note='Writing your lesson…';render();
 try{const j=JSON.parse(clean(await gem(`You teach the England national curriculum, Key Stage ${k}, Year ${S.yr}. Write a short accurate lesson on "${t}" in ${s}. Return only JSON: {"sections":[{"h":"","p":""}],"questions":[{"q":"","o":["","","",""],"a":0,"e":""}]} with 3 sections and 8 questions.`,1)));
  const qs=(j.questions||[]).filter(q=>q.o&&q.o.length==4&&q.a>=0&&q.a<4);if(!qs.length||!j.sections)throw new Error('The AI returned no usable lesson.');
  S.lessons[tk(s,k,t)]={sections:j.sections,qs};S.lt=tk(s,k,t);S.note=''}catch(e){S.note=e instanceof SyntaxError?'The AI reply wasn’t valid. Try again.':gerr(e)}render()}
function startTopic(s,k,t){const key=tk(s,k,t),L=S.lessons[key],y=S.yr||5;
 const qs=L?L.qs.map(q=>({...q,s})):s=='Maths'?Array.from({length:10},()=>mathQ(y,2)):pool(s,y,2).slice(0,10);
 if(!qs.length){S.note='No built-in questions for this topic. Add your AI key in Tutor to generate a lesson and questions.';S.lt='';return render()}
 PQ={id:'t-'+key,title:t,subj:s,qs,topic:key};begin(PQ.id)}

applyTheme();render();init();
</script></body></html>
